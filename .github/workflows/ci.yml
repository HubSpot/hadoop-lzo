name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job runs on a throwaway runner, so the Gradle daemon is never reused and
# its startup is pure overhead. Run every ./gradlew invocation without it.
env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  # Build libgplcompression natively on each target platform. lzo2 is statically
  # linked in, so each artifact is self-contained. One artifact per platform,
  # each holding native/<os>-<arch>-64/lib/libgplcompression.{so,dylib}.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux-amd64-64
          - os: ubuntu-24.04-arm
            platform: Linux-aarch64-64
          - os: macos-15-intel
            platform: Mac_OS_X-x86_64-64
          - os: macos-latest
            platform: Mac_OS_X-aarch64-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # Generates the JNI headers that the native sources compile against.
      - name: Generate JNI headers
        run: ./gradlew compileJava --console=plain

      - name: Build native library
        run: ./scripts/build-native.sh

      - name: Inspect (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          f=build/native-resources/native/${{ matrix.platform }}/lib/libgplcompression.so
          file "$f"; ldd "$f" || true

      - name: Inspect (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          f=build/native-resources/native/${{ matrix.platform }}/lib/libgplcompression.dylib
          file "$f"; otool -L "$f"

      # Loads this platform's freshly built library and round-trips data through
      # the codec, so every arch is exercised at runtime (not just compiled).
      # -x buildNative reuses the library built above instead of rebuilding it.
      - name: Smoke test
        run: ./gradlew smokeTest -x buildNative --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native-resources
          if-no-files-found: error

  # Cross-compile the Linux library for architectures with no GitHub-hosted
  # runner. clang targets each triple against its GNU sysroot; the output can't
  # be executed on the x86_64 runner, so the ELF header is verified instead of
  # running a smoke test. Each leg uploads the same native-<platform> artifact
  # shape as the host-native legs, so the package job picks them up unchanged.
  cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ppc64
            platform: Linux-ppc64-64
            triple: powerpc64-linux-gnu
            cross_pkg: gcc-powerpc64-linux-gnu libc6-dev-ppc64-cross
            elf_machine: PowerPC64
            elf_data: big endian
          - arch: ppc64le
            platform: Linux-ppc64le-64
            triple: powerpc64le-linux-gnu
            cross_pkg: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
            elf_machine: PowerPC64
            elf_data: little endian
          - arch: s390x
            platform: Linux-s390x-64
            triple: s390x-linux-gnu
            cross_pkg: gcc-s390x-linux-gnu libc6-dev-s390x-cross
            elf_machine: IBM S/390
            elf_data: big endian
          - arch: riscv64
            platform: Linux-riscv64-64
            triple: riscv64-linux-gnu
            cross_pkg: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
            elf_machine: RISC-V
            elf_data: little endian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install clang and cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ${{ matrix.cross_pkg }}

      - name: Generate JNI headers
        run: ./gradlew compileJava --console=plain

      - name: Build native library
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./scripts/build-native.sh

      - name: Verify ELF architecture
        run: |
          f=build/native-resources/native/${{ matrix.platform }}/lib/libgplcompression.so
          file "$f"
          readelf -h "$f"
          readelf -h "$f" | grep -q "${{ matrix.elf_machine }}"
          readelf -h "$f" | grep -qi "${{ matrix.elf_data }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native-resources
          if-no-files-found: error

  # Windows builds with MSVC and compiles LZO straight into gplcompression.dll.
  # The x64 leg is native and runs an in-memory codec smoke test (the full Hadoop
  # JUnit suite needs winutils/hadoop.dll). The arm64 leg cross-compiles with the
  # ARM64 MSVC toolset on the x64 runner, so it can't run; its DLL machine type
  # is inspected instead. Both upload the same native-<platform> artifact shape.
  native-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: Windows-amd64-64
            msvc_arch: amd64
            machine: x64
            smoke: true
          - arch: arm64
            platform: Windows-aarch64-64
            msvc_arch: amd64_arm64
            machine: ARM64
            smoke: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Generate JNI headers
        run: .\gradlew.bat compileJava --console=plain

      - name: Build native library
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: .\scripts\build-native.ps1

      - name: Inspect
        run: |
          $dll = "build/native-resources/native/${{ matrix.platform }}/lib/gplcompression.dll"
          dumpbin /dependents $dll
          $headers = dumpbin /headers $dll
          $headers | Select-String "machine"
          if (-not ($headers -match "${{ matrix.machine }}")) {
            throw "Expected machine '${{ matrix.machine }}' not found in DLL headers"
          }

      - name: Smoke test
        if: matrix.smoke
        run: .\gradlew.bat smokeTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native-resources
          if-no-files-found: error

  # Runs the JUnit suite against a freshly built native library on Linux x86_64.
  # JDK 11 because Hadoop 3.3.1 relies on Subject.getSubject, removed in JDK 24+.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Test
        run: ./gradlew test --console=plain

  # Assembles the single multi-platform JAR from every platform's native
  # artifact, then publishes it to a GitHub Release on tag pushes.
  package:
    needs: [native, cross, native-windows, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Collect native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: build/native-resources

      - name: Show assembled native tree
        run: find build/native-resources/native -type f

      # Releases are versioned by their git tag (e.g. v2.10-1 -> 2.10-1); other
      # builds stay unversioned.
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # jar is deliberately decoupled from the native build, so this packages
      # only the downloaded artifacts without invoking a compiler. smokeTestJar
      # then loads the codec from the assembled jar (Linux x86_64 entry) and
      # round-trips data, validating the native/ resource layout, manifest, and
      # build.properties as a consumer sees them.
      - name: Package JAR and smoke test
        run: |
          ARGS=""
          if [ -n "${RELEASE_VERSION:-}" ]; then
            ARGS="-Pversion=${RELEASE_VERSION}"
          fi
          ./gradlew jar smokeTestJar $ARGS --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: hadoop-lzo-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          fail_on_unmatched_files: true
