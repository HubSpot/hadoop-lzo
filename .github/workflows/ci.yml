name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build libgplcompression natively on each target platform. lzo2 is statically
  # linked in, so each artifact is self-contained. One artifact per platform,
  # each holding native/<os>-<arch>-64/lib/libgplcompression.{so,dylib}.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux-amd64-64
          # GitHub-hosted arm64 Linux runner. If this runner class is not
          # enabled for the org, switch this leg to QEMU (docker run
          # --platform linux/arm64) building inside the same image.
          - os: ubuntu-24.04-arm
            platform: Linux-aarch64-64
          - os: macos-15-intel
            platform: Mac_OS_X-x86_64-64
          - os: macos-latest
            platform: Mac_OS_X-aarch64-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin

      # Generates the JNI headers that the native sources compile against.
      - name: Generate JNI headers
        run: ./gradlew compileJava --console=plain

      - name: Build native library
        env:
          PLATFORM_DIR: ${{ matrix.platform }}
        run: ./scripts/build-native.sh

      - name: Inspect (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          f=build/native-resources/native/${{ matrix.platform }}/lib/libgplcompression.so
          file "$f"; ldd "$f" || true

      - name: Inspect (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          f=build/native-resources/native/${{ matrix.platform }}/lib/libgplcompression.dylib
          file "$f"; otool -L "$f"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native-resources
          if-no-files-found: error

  # Windows builds with MSVC and compiles LZO straight into gplcompression.dll.
  # The full Hadoop JUnit suite needs winutils/hadoop.dll, so this leg runs an
  # in-memory codec smoke test instead.
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate JNI headers
        run: .\gradlew.bat compileJava --console=plain

      - name: Build native library
        env:
          PLATFORM_DIR: Windows-amd64-64
        run: .\scripts\build-native.ps1

      - name: Inspect
        run: |
          $dll = "build/native-resources/native/Windows-amd64-64/lib/gplcompression.dll"
          dumpbin /dependents $dll

      - name: Smoke test
        run: .\gradlew.bat smokeTest --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: native-Windows-amd64-64
          path: build/native-resources
          if-no-files-found: error

  # Runs the JUnit suite against a freshly built native library on Linux x86_64.
  # JDK 11 because Hadoop 3.3.1 relies on Subject.getSubject, removed in JDK 24+.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
      - name: Test
        run: ./gradlew test --console=plain

  # Assembles the single multi-platform JAR from every platform's native
  # artifact, then publishes it to a GitHub Release on tag pushes.
  package:
    needs: [native, native-windows, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin

      - name: Collect native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: build/native-resources

      - name: Show assembled native tree
        run: find build/native-resources/native -type f

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # jar is deliberately decoupled from the native build, so this packages
      # only the downloaded artifacts without invoking a compiler.
      - name: Package JAR
        run: |
          if [ -n "${RELEASE_VERSION:-}" ]; then
            ./gradlew jar --console=plain -Pversion="${RELEASE_VERSION}"
          else
            ./gradlew jar --console=plain
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hadoop-lzo-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          fail_on_unmatched_files: true
